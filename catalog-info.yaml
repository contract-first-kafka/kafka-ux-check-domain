apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: kafka-ux-check
  title: Kafka UX validation
  description: Disposable end-to-end validation of simplified Kafka Component selection; retain for inspection.
  annotations:
    contract-first-idp.github.io/scm-provider: github
    contract-first-idp.github.io/scm-host: github.com
    contract-first-idp.github.io/domain-org: contract-first-kafka
    contract-first-idp.github.io/domain-repo: kafka-ux-check-domain
  links:
    - url: https://github.com/contract-first-kafka/kafka-ux-check-domain
      title: Domain repository
      icon: github
spec:
  owner: group:default/domain-maintainers
  platformTarget: resource:default/workshop
  groupId: io.github.contractfirstkafka.kafkaux
  eventCatalog:
    enabled: true
  environments:
    order:
      - dev
    build: dev
    definitions:
      dev:
        namespaceSuffix: "-dev"
